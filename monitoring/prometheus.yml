# PulseGuard Prometheus Configuration
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Send alerts to Alertmanager
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Load alert rules
rule_files:
  - "/etc/prometheus/alert.rules.yml"

scrape_configs:
  # PulseGuard FastAPI microservice
  - job_name: "pulseguard"
    metrics_path: "/metrics/"
    static_configs:
      - targets: ["pulseguard:8000"]
        labels:
          app: "pulseguard"
          env: "local"

  # Prometheus self-monitoring
  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

  # Node Exporter for host metrics (CPU, RAM, disk, filesystem)
  - job_name: "node-exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          app: "node-exporter"
          env: "local"

  # cAdvisor for container metrics (CPU, memory, network)
  - job_name: "cadvisor"
    static_configs:
      - targets: ["cadvisor:8080"]
        labels:
          app: "cadvisor"
          env: "local"
