groups:
  - name: pulseguard-alerts
    rules:
      - alert: PulseGuardScrapeFailed
        expr: up{job="pulseguard"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PulseGuard metrics scrape failed"
          description: "Prometheus cannot scrape the PulseGuard metrics endpoint."
      - alert: PulseGuardHealthCheckFailed
        expr: pulseguard_health == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PulseGuard application health check failed"
          description: "The application health endpoint is reporting a failure."
      - alert: SelfHealingFailure
        expr: self_heal_failure_total > 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "PulseGuard self-healing failed"
          description: "A self-healing recovery attempt has failed."
